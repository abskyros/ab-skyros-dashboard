name: Πωλήσεις (OCR)

on:
  schedule:
    # ══════════════════════════════════════════════════════════════════════════
    # ΓΙΑΤΙ ΑΛΛΑΞΕ ΑΠΟ */5 ΣΕ */15 + ΣΙΓΟΥΡΑ RUNS
    #
    # ┌──────────────────────────────────────────────────────────────────────┐
    # │ ΤΟ GITHUB ΠΝΙΓΕΙ ΤΑ ΣΥΧΝΑ CRONS                                      │
    # │                                                                      │
    # │ Τα scheduled workflows ΔΕΝ είναι εγγυημένα. Όσο πιο συχνό το cron,   │
    # │ τόσο πιο πιθανό το GitHub να το παραλείψει όταν έχει φόρτο.          │
    # │                                                                      │
    # │ Με */5 (κάθε 5'), μια νύχτα έτρεξε ΜΟΝΟ 1 από τα ~84 αναμενόμενα     │
    # │ runs — και η αναφορά χάθηκε, παρότι ο κώδικας δούλευε τέλεια.        │
    # │                                                                      │
    # │ ΛΥΣΗ:                                                               │
    # │   • */15 αντί */5 — πιο αραιό, το GitHub το σέβεται περισσότερο.     │
    # │   • ΣΙΓΟΥΡΑ runs σε στρογγυλές ώρες (:00) χαμηλού φόρτου, που έχουν   │
    # │     πολύ μεγαλύτερη πιθανότητα να τρέξουν στην ώρα τους.             │
    # │   • Δίχτυ ασφαλείας: ο «Πρωινός συγχρονισμός» (daily_sync) στις 05:00│
    # │     UTC πιάνει ό,τι έχασε η νύχτα — κάνει κι αυτός OCR πωλήσεων.      │
    # └──────────────────────────────────────────────────────────────────────┘
    #
    # ΩΡΑ: το cron τρέχει ΠΑΝΤΑ σε UTC, χωρίς θερινή ώρα. Τρέχουμε ΕΥΡΕΩΣ
    # (18:00-03:59 UTC), και το ΙΔΙΟ ΤΟ SCRIPT ελέγχει την πραγματική ώρα
    # Ελλάδας (zoneinfo) και βγαίνει αμέσως αν είναι νωρίς — χωρίς Gmail/OCR.
    #
    #     Καλοκαίρι (UTC+3): 21:00 Ελλάδας = 18:00 UTC
    #     Χειμώνας  (UTC+2): 21:00 Ελλάδας = 19:00 UTC
    # ══════════════════════════════════════════════════════════════════════════

    # Κάθε 15 λεπτά, όλο το βραδινό παράθυρο (18:00-03:59 UTC).
    - cron: '*/15 18,19,20,21,22,23 * * *'
    - cron: '*/15 0,1,2,3 * * *'

    # ΣΙΓΟΥΡΑ runs σε στρογγυλές ώρες χαμηλού φόρτου — μεγαλύτερη πιθανότητα να
    # τρέξουν στην ώρα τους. Καλύπτουν 21:00, 22:00, 23:00, 00:00, 01:00, 02:00
    # ώρα Ελλάδας (και χειμώνα και καλοκαίρι, λόγω του εύρους UTC).
    - cron: '0 18,19,20,21,22,23,0,1 * * *'
  workflow_dispatch:
    inputs:
      deep:
        description: "Βαθιά σάρωση (άνοιξε ΟΛΕΣ τις αναφορές, όχι μόνο τις γνωστές)"
        required: false
        default: ""
      since:
        description: "Βαθιά σάρωση: από ποια μέρα (YYYY-MM-DD). Κενό = 7 μέρες πίσω"
        required: false
        default: ""

# Αν μια εκτέλεση αργήσει, η επόμενη ΔΕΝ ξεκινάει παράλληλα.
# Χωρίς αυτό, δύο διεργασίες θα διάβαζαν τα ίδια email ταυτόχρονα και θα
# μπορούσαν να γράψουν την ίδια μέρα δύο φορές.
concurrency:
  group: sales-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Το OCR εγκαθίσταται ΜΟΝΟ αν χρειάζεται.
      #
      # Το apt-get παίρνει ~40 δευτερόλεπτα. Αν το script πρόκειται να βγει
      # αμέσως (πολύ νωρίς, ή η μέρα υπάρχει ήδη), δεν έχει νόημα.
      #
      # Πρώτα ρωτάμε το script αν έχει δουλειά.
      - name: Ελαφρύς έλεγχος
        id: check
        env:
          GOOGLE_KEY_JSON: ${{ secrets.GOOGLE_KEY_JSON }}
          # ΧΕΙΡΟΚΙΝΗΤΗ ΕΚΤΕΛΕΣΗ (κουμπί): αγνόησε το ωράριο, τρέξε τώρα.
          # Το workflow_dispatch σημαίνει «ο χρήστης το πάτησε» → FORCE_RUN=1.
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          # Βαθιά σάρωση: ο precheck πρέπει να πει «ναι» ακόμα κι αν δεν λείπει
          # μέρα, γιατί ψάχνουμε καθυστερημένες παλιές αναφορές.
          DEEP: ${{ github.event.inputs.deep }}
        run: |
          pip install -q -r requirements.txt
          if python jobs/sales_precheck.py; then
            echo "work=yes" >> $GITHUB_OUTPUT
          else
            echo "work=no" >> $GITHUB_OUTPUT
          fi

      - name: OCR (tesseract + poppler + ελληνικά)
        if: steps.check.outputs.work == 'yes'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ell poppler-utils

      - name: Εγκατάσταση OCR
        if: steps.check.outputs.work == 'yes'
        run: pip install -q -r requirements-ocr.txt

      - name: Συγχρονισμός
        if: steps.check.outputs.work == 'yes'
        env:
          GOOGLE_KEY_JSON: ${{ secrets.GOOGLE_KEY_JSON }}
          SALES_EMAIL_PASS: ${{ secrets.SALES_EMAIL_PASS }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          # Βαθιά σάρωση: τα inputs περνάνε στο script ως env.
          DEEP: ${{ github.event.inputs.deep }}
          SINCE: ${{ github.event.inputs.since }}
        run: python jobs/sales_sync.py

