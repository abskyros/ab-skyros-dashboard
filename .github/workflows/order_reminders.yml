name: Πρωινή υπενθύμιση παραγγελιών

on:
  schedule:
    # 07:00-08:00 ώρα Ελλάδας (05:00 UTC· καλοκαίρι 08:00, χειμώνα 07:00).
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: order-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Εγκατάσταση
        run: pip install -r requirements.txt

      - name: Έλεγχος & υπενθύμιση
        env:
          GOOGLE_KEY_JSON: ${{ secrets.GOOGLE_KEY_JSON }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python jobs/order_reminders.py
