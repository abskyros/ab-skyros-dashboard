name: Παραστατικά & Τιμολογήσεις

on:
  schedule:
    # Κάθε 2 ώρες. Τα email έρχονται όλη μέρα, δεν έχουν σταθερή ώρα.
    - cron: '0 */2 * * *'
    # ══════════════════════════════════════════════════════════════════════
    # ΠΕΜΠΤΗ — ΤΙΜΟΛΟΓΗΣΗ ΠΙΣΤΩΤΙΚΟΥ
    #
    # Το mail της τιμολόγησης έρχεται ΚΑΘΕ ΠΕΜΠΤΗ από τις 10:00 (ώρα
    # Ελλάδας) και μετά. Την Πέμπτη λοιπόν ψάχνουμε κάθε 15 λεπτά, ώστε
    # μόλις εντοπιστεί να καταχωρείται αυτόματα — όχι 2 ώρες αργότερα.
    #
    # Το cron είναι UTC και δεν ξέρει θερινή ώρα:
    #   Καλοκαίρι (UTC+3): 10:00 Ελλάδας = 07:00 UTC
    #   Χειμώνας  (UTC+2): 10:00 Ελλάδας = 08:00 UTC
    # Το εύρος 07:00–14:59 UTC καλύπτει 10:00–16:59 Ελλάδας το καλοκαίρι
    # και 09:00–15:59 το χειμώνα — και τις δύο περιπτώσεις πιάνει το mail.
    #
    # (Ημέρα 4 στο cron = Πέμπτη.)
    # ══════════════════════════════════════════════════════════════════════
    - cron: '*/15 7-14 * * 4'
  workflow_dispatch:

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Εγκατάσταση
        run: pip install -r requirements.txt

      - name: Συγχρονισμός
        env:
          GOOGLE_KEY_JSON: ${{ secrets.GOOGLE_KEY_JSON }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          # Οι τιμολογήσεις έρχονται στο ftoulisgm@gmail.com — χωρίς αυτό
          # το secret το login σε εκείνο το mailbox αποτυγχάνει και οι
          # τιμολογήσεις δεν ενημερώνονταν ΠΟΤΕ από αυτό το workflow.
          SALES_EMAIL_PASS: ${{ secrets.SALES_EMAIL_PASS }}
        run: python jobs/data_sync.py
