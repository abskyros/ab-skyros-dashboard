name: Παραστατικά & Τιμολογήσεις

on:
  schedule:
    # ══════════════════════════════════════════════════════════════════════════
    # ΚΑΝΟΝΙΚΕΣ ΜΕΡΕΣ — κάθε 2 ώρες
    #
    # Τα παραστατικά (WeDoConnect) έρχονται όλη μέρα, χωρίς σταθερή ώρα. Κάθε
    # 2 ώρες αρκεί για να τα πιάνουμε έγκαιρα.
    # ══════════════════════════════════════════════════════════════════════════
    - cron: '0 */2 * * *'

    # ══════════════════════════════════════════════════════════════════════════
    # ΠΕΜΠΤΗ — ΤΙΜΟΛΟΓΗΣΕΙΣ (πυκνός έλεγχος, 11:00-16:00 Ελλάδας)
    #
    # Οι τιμολογήσεις έρχονται συνήθως ΠΕΜΠΤΗ, ΑΠΟ ΤΙΣ 11:00 ΜΕΧΡΙ ΤΙΣ 16:00
    # (ώρα Ελλάδας). Σε αυτό το διάστημα ψάχνουμε πυκνά — κάθε 10 λεπτά — ώστε
    # μόλις έρθει η τιμολόγηση να καταχωρείται αμέσως, όχι 2 ώρες αργότερα.
    #
    # ┌────────────────────────────────────────────────────────────────────────┐
    # │ ΩΡΑ: το cron τρέχει ΠΑΝΤΑ σε UTC, χωρίς θερινή ώρα.                     │
    # │                                                                        │
    # │     Καλοκαίρι (UTC+3): 11:00-16:00 Ελλάδας = 08:00-13:00 UTC            │
    # │     Χειμώνας  (UTC+2): 11:00-16:00 Ελλάδας = 09:00-14:00 UTC            │
    # │                                                                        │
    # │ Καλύπτουμε ΚΑΙ ΤΑ ΔΥΟ με UTC ώρες 08-14 (Πέμπτη, day=4).               │
    # │                                                                        │
    # │ Επειδή το GitHub «πνίγει» τα πολύ συχνά crons, βάζουμε ΚΑΙ σίγουρα runs │
    # │ στο :00 κάθε ώρας — μεγαλύτερη πιθανότητα να τρέξουν στην ώρα τους.     │
    # └────────────────────────────────────────────────────────────────────────┘
    - cron: '*/10 8,9,10,11,12,13,14 * * 4'
    - cron: '0 8,9,10,11,12,13,14 * * 4'
  workflow_dispatch:

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Εγκατάσταση
        run: pip install -r requirements.txt

      - name: Συγχρονισμός
        env:
          GOOGLE_KEY_JSON: ${{ secrets.GOOGLE_KEY_JSON }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          # Οι τιμολογήσεις έρχονται στο ftoulisgm@gmail.com — χωρίς αυτό το
          # secret το login σε εκείνο το mailbox αποτυγχάνει.
          SALES_EMAIL_PASS: ${{ secrets.SALES_EMAIL_PASS }}
        run: python jobs/data_sync.py

