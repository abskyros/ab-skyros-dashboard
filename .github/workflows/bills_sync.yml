name: Λογαριασμοί παρόχων

# Ξεκινά από την εφαρμογή όταν προσθέτεις «πάροχο με email» (παλιοί λογαριασμοί,
# 2 χρόνια πίσω). Τους καινούργιους τους πιάνει κάθε βράδυ/πρωί το daily_sync.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "id παρόχου (κενό = όλοι)"
        required: false
        default: ""
      days:
        description: "Πόσες μέρες πίσω (730 = 2 χρόνια)"
        required: false
        default: "730"

concurrency:
  group: bills-sync
  cancel-in-progress: false

jobs:
  bills:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: OCR (tesseract + poppler + ελληνικά)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ell poppler-utils

      - name: Εγκατάσταση
        run: pip install -r requirements-ocr.txt

      - name: Λογαριασμοί
        env:
          GOOGLE_KEY_JSON: ${{ secrets.GOOGLE_KEY_JSON }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          SALES_EMAIL_PASS: ${{ secrets.SALES_EMAIL_PASS }}
          PROVIDER: ${{ github.event.inputs.provider }}
          DAYS: ${{ github.event.inputs.days }}
        run: python jobs/bills_sync.py
