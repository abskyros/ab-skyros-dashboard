# Κλειδώνει το ΦΩΤΕΙΝΟ θέμα, όπως κι αν είναι ρυθμισμένο το κινητό.
#
# Χωρίς αυτό, σε κινητό με σκούρο θέμα το Streamlit έβαφε τα δικά του στοιχεία
# σκούρα και το κείμενο λευκό, ενώ η σελίδα μας είναι ανοιχτόχρωμη: στον πίνακα
# του «Μήνα» έβγαιναν λευκά νούμερα πάνω σε ανοιχτό γκρι, δηλαδή αόρατα.
# Τα χρώματα ταιριάζουν με το ui/style.css.
[theme]
base = "light"
primaryColor = "#101a2f"
backgroundColor = "#f6f7f9"
secondaryBackgroundColor = "#EFF2F7"
textColor = "#1E293B"
